<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#18233c"/>
      <stop offset="60%" stop-color="#090d18"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#ff7b00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#4cc9f0" stroke-width="6" opacity="0.4"/>

  <path d="M 60 180 L 220 180" stroke="#4cc9f0" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  <path d="M 40 240 L 180 240" stroke="#ffd23f" stroke-width="12" stroke-linecap="round" opacity="0.4"/>
  <path d="M 80 300 L 210 300" stroke="#4cc9f0" stroke-width="8" stroke-linecap="round" opacity="0.3"/>

  <g filter="url(#glow)">
    <circle cx="310" cy="140" r="38" fill="url(#neonCyan)"/>
    <path d="M 315 130 L 348 135 L 340 150 L 315 146 Z" fill="#ffffff"/>
    <path d="M 285 180 L 330 190 L 305 275 L 260 255 Z" fill="url(#neonGold)"/>
    <path d="M 320 195 L 375 225 L 415 200" fill="none" stroke="url(#neonCyan)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 270 205 L 215 220 L 175 260" fill="none" stroke="#4cc9f0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <path d="M 295 270 L 355 315 L 380 395" fill="none" stroke="url(#neonGold)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 265 260 L 195 310 L 125 365" fill="none" stroke="url(#neonCyan)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <polygon points="255,80 270,120 250,125 285,175 265,130 280,125" fill="#ffe600" opacity="0.9"/>

  <rect x="56" y="420" width="400" height="56" rx="14" fill="#0f172a" stroke="#ffd23f" stroke-width="2" opacity="0.95"/>
  <text x="256" y="458" font-family="'Orbitron', sans-serif, -apple-system" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">RUN &amp; RUN</text>
</svg>
