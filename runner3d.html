<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Original 3D Runner</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b3a5c; }
  #info {
    position: fixed; top: 12px; left: 0; right: 0; text-align: center;
    color: #fff; font-family: sans-serif; font-size: 14px; pointer-events: none;
    text-shadow: 0 2px 4px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
<div id="info">Original 3D runner • Drag to rotate • Scroll to zoom</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  if (typeof THREE === 'undefined') {
    document.body.innerHTML = '<p style="color:#fff;font-family:sans-serif;padding:20px">three.js failed to load. Check your internet connection and reload.</p>';
    return;
  }

  // ---------- Renderer, scene, camera ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1b3a5c);
  scene.fog = new THREE.Fog(0x1b3a5c, 12, 30);

  const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
  let camDist = 6.2, camYaw = 0.35, camPitch = 0.22;

  // ---------- Lights ----------
  scene.add(new THREE.HemisphereLight(0xbfe6ff, 0x2a1d3d, 0.9));

  const sun = new THREE.DirectionalLight(0xffffff, 1.1);
  sun.position.set(4, 8, 5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -3; sun.shadow.camera.right = 3;
  sun.shadow.camera.top = 4;   sun.shadow.camera.bottom = -2;
  sun.shadow.bias = -0.0005;
  scene.add(sun);

  const rim = new THREE.DirectionalLight(0x7dd3fc, 0.6);
  rim.position.set(-5, 4, -4);
  scene.add(rim);

  // ---------- Ground (running track) ----------
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshStandardMaterial({ color: 0x3b5b7a, roughness: 0.9 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Track lane stripes
  const stripeMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.6 });
  for (const x of [-1.1, 1.1]) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.01, 40), stripeMat);
    s.position.set(x, 0.005, 0);
    s.receiveShadow = true;
    scene.add(s);
  }

  // ---------- Materials (original palette: teal vest, mint hoodie, navy shorts) ----------
  const mat = {
    skin:    new THREE.MeshStandardMaterial({ color: 0x8d5524, roughness: 0.55 }),
    hair:    new THREE.MeshStandardMaterial({ color: 0x6d28d9, roughness: 0.6 }),
    hoodie:  new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5, metalness: 0.2 }),
    vest:    new THREE.MeshStandardMaterial({ color: 0x0b1120, roughness: 0.4, metalness: 0.3 }),
    pants:   new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.7 }),
    shoe:    new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.4 }),
    sole:    new THREE.MeshStandardMaterial({ color: 0x0ea5e9, emissive: 0x0ea5e9, emissiveIntensity: 0.8, roughness: 0.4 }),
    beanie:  new THREE.MeshStandardMaterial({ color: 0x67e8f9, emissive: 0x22d3ee, emissiveIntensity: 1.0, roughness: 0.2 }),
    eye:     new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.3 }),
    star:    new THREE.MeshStandardMaterial({ color: 0xfef08a, roughness: 0.3, emissive: 0x854d0e, emissiveIntensity: 0.4 }),
    board:   new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3, metalness: 0.4 }),
    neon:    new THREE.MeshStandardMaterial({ color: 0x22d3ee, emissive: 0x22d3ee, emissiveIntensity: 1.2, roughness: 0.3 }),
    wheel:   new THREE.MeshStandardMaterial({ color: 0x22d3ee, emissive: 0x22d3ee, emissiveIntensity: 1.2, roughness: 0.3 }),
    pad:     new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.4, metalness: 0.5 })
  };

  function part(geo, material, x, y, z) {
    const m = new THREE.Mesh(geo, material);
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  }

  // ---------- Character ----------
  const runner = new THREE.Group();
  scene.add(runner);

  // Body pivot (bobs while running)
  const body = new THREE.Group();
  runner.add(body);

  // Head: large and round, the focal point of the design
  const head = new THREE.Group();
  head.position.set(0, 1.62, 0);
  body.add(head);
  head.add(part(new THREE.SphereGeometry(0.42, 32, 24), mat.skin, 0, 0, 0));

  // Hair under beanie, eyes, smile, nose
  head.add(part(new THREE.SphereGeometry(0.43, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.45), mat.hair, 0, 0.05, 0));
  for (const ex of [-0.15, 0.15]) {
    head.add(part(new THREE.SphereGeometry(0.055, 16, 12), mat.eye, ex, 0.05, 0.37));
  }
  head.add(part(new THREE.SphereGeometry(0.035, 12, 10), mat.skin, 0, -0.02, 0.41));
  const smile = part(new THREE.TorusGeometry(0.1, 0.018, 8, 20, Math.PI), mat.eye, 0, -0.12, 0.36);
  smile.rotation.z = Math.PI;
  head.add(smile);

  // Purple locs: small rounded strands around the scalp
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const lx = Math.cos(a) * 0.36;
    const lz = Math.sin(a) * 0.36;
    const loc = part(new THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.07, 0.22, 4, 8) : new THREE.CylinderGeometry(0.07, 0.07, 0.3, 8), mat.hair, lx, 0.32, lz);
    loc.rotation.z = Math.cos(a) * 0.35;
    loc.rotation.x = -Math.sin(a) * 0.35;
    head.add(loc);
  }
  // Cyan visor goggles across the eyes
  const visor = part(new THREE.BoxGeometry(0.5, 0.12, 0.08), mat.beanie, 0, 0.1, 0.38);
  visor.rotation.x = -0.1;
  head.add(visor);

  // Neck
  body.add(part(new THREE.CylinderGeometry(0.13, 0.15, 0.18, 16), mat.skin, 0, 1.3, 0));

  // Torso: hoodie with orange vest on top
  const torso = part(new THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.36, 0.42, 8, 16) : new THREE.CylinderGeometry(0.36, 0.36, 0.8, 16), mat.hoodie, 0, 0.92, 0);
  body.add(torso);

  const vest = part(new THREE.CylinderGeometry(0.4, 0.37, 0.5, 20, 1, true, Math.PI * 0.2, Math.PI * 1.6), mat.vest, 0, 0.95, 0);
  body.add(vest);
  // Neon stripes running down the jacket
  for (const x of [-0.22, 0.22]) {
    const stripe = part(new THREE.BoxGeometry(0.03, 0.5, 0.03), mat.neon, x, 0.95, 0.4);
    body.add(stripe);
  }

  // Star emblem on the vest
  const starShape = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? 0.09 : 0.04;
    const a = Math.PI / 2 + (i * Math.PI) / 5;
    const px = Math.cos(a) * r, py = Math.sin(a) * r;
    if (i === 0) starShape.moveTo(px, py); else starShape.lineTo(px, py);
  }
  const starGeo = new THREE.ExtrudeGeometry(starShape, { depth: 0.02, bevelEnabled: false });

  // Arms: chunky, rounded, swing opposite to legs
  function makeArm(side) {
    const pivot = new THREE.Group();
    pivot.position.set(side * 0.48, 1.18, 0);
    pivot.add(part(new THREE.SphereGeometry(0.12, 16, 12), mat.hoodie, 0, 0, 0));
    pivot.add(part(new THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.11, 0.3, 6, 12) : new THREE.CylinderGeometry(0.11, 0.11, 0.42, 12), mat.hoodie, 0, -0.27, 0));
    pivot.add(part(new THREE.SphereGeometry(0.13, 16, 12), mat.skin, 0, -0.56, 0));
    body.add(pivot);
    return pivot;
  }
  const armL = makeArm(-1), armR = makeArm(1);

  // Hips
  const hips = new THREE.Group();
  hips.position.set(0, 0.6, 0);
  body.add(hips);
  hips.add(part(new THREE.CylinderGeometry(0.3, 0.27, 0.22, 20), mat.pants, 0, 0, 0));

  // Legs: long and thin, sneakers with thick soles
  function makeLeg(side) {
    const pivot = new THREE.Group();
    pivot.position.set(side * 0.16, 0.5, 0);
    pivot.add(part(new THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.1, 0.5, 6, 12) : new THREE.CylinderGeometry(0.1, 0.1, 0.7, 12), mat.pants, 0, -0.35, 0));
    const knee = new THREE.Group();
    knee.position.set(0, -0.7, 0);
    pivot.add(knee);
    knee.add(part(new THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.09, 0.5, 6, 12) : new THREE.CylinderGeometry(0.09, 0.09, 0.7, 12), mat.pants, 0, -0.35, 0));
    const shoe = new THREE.Group();
    shoe.position.set(0, -0.78, 0.04);
    knee.add(shoe);
    shoe.add(part(new THREE.BoxGeometry(0.22, 0.16, 0.4), mat.shoe, 0, 0, 0.08));
    shoe.add(part(new THREE.BoxGeometry(0.24, 0.07, 0.44), mat.sole, 0, -0.11, 0.1));
    const kneePad = part(new THREE.SphereGeometry(0.12, 16, 12), mat.pad, 0, -0.7, 0.07);
    kneePad.scale.set(1, 1.1, 0.7);
    pivot.add(kneePad);
    body.add(pivot);
    return { pivot, knee };
  }
  const legL = makeLeg(-1), legR = makeLeg(1);

  // ---------- Realistic skateboard ----------
  // Deck geometry: rounded-ends outline, extruded to a thin board (lies flat on XZ)
  function roundedBoardShape(len, wid, r) {
    const sh = new THREE.Shape();
    const hx = len / 2, hy = wid / 2;
    sh.moveTo(-hx + r, -hy);
    sh.lineTo(hx - r, -hy);
    sh.quadraticCurveTo(hx, -hy, hx, -hy + r);
    sh.lineTo(hx, hy - r);
    sh.quadraticCurveTo(hx, hy, hx - r, hy);
    sh.lineTo(-hx + r, hy);
    sh.quadraticCurveTo(-hx, hy, -hx, hy - r);
    sh.lineTo(-hx, -hy + r);
    sh.quadraticCurveTo(-hx, -hy, -hx + r, -hy);
    return sh;
  }
  function boardGeometry(len, wid, thick, bevel) {
    const g = new THREE.ExtrudeGeometry(roundedBoardShape(len, wid, 0.12), {
      depth: thick, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2, curveSegments: 12
    });
    g.rotateX(-Math.PI / 2);   // shape XY -> XZ plane, extrusion -> up
    g.translate(0, -thick / 2, 0);
    return g;
  }

  // Maple wood deck with procedural grain
  const woodCanvas = document.createElement('canvas');
  woodCanvas.width = 256; woodCanvas.height = 512;
  const wctx = woodCanvas.getContext('2d');
  wctx.fillStyle = '#c9975a';
  wctx.fillRect(0, 0, 256, 512);
  for (let i = 0; i < 260; i++) {
    const x = Math.random() * 256;
    wctx.strokeStyle = 'rgba(' + (90 + Math.random() * 40 | 0) + ',' + (50 + Math.random() * 25 | 0) + ',20,' + (0.12 + Math.random() * 0.2).toFixed(2) + ')';
    wctx.lineWidth = 0.6 + Math.random() * 1.6;
    wctx.beginPath();
    wctx.moveTo(x, 0);
    wctx.bezierCurveTo(x + (Math.random() - 0.5) * 12, 170, x + (Math.random() - 0.5) * 12, 340, x + (Math.random() - 0.5) * 6, 512);
    wctx.stroke();
  }
  const woodTex = new THREE.CanvasTexture(woodCanvas);
  woodTex.wrapS = THREE.RepeatWrapping;
  const deckMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.55, metalness: 0.0 });
  const gripMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.98, metalness: 0.0 });
  const truckMat = new THREE.MeshStandardMaterial({ color: 0xb8bcc4, roughness: 0.35, metalness: 0.85 });
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0xf1ead8, roughness: 0.45, metalness: 0.0 });
  const bearingMat = new THREE.MeshStandardMaterial({ color: 0x3a3f47, roughness: 0.3, metalness: 0.9 });

  const board = new THREE.Group();
  board.position.set(0, -1.155, 0);   // wheels touch the ground, feet sit on the deck (see runner.position.y)
  runner.add(board);

  // Deck (wood) and grip tape on top
  const deckGeo = boardGeometry(0.86, 0.23, 0.022, 0.006);
  const deckMesh = new THREE.Mesh(deckGeo, deckMat);
  deckMesh.castShadow = true; deckMesh.receiveShadow = true;
  board.add(deckMesh);
  const grip = new THREE.Mesh(boardGeometry(0.84, 0.21, 0.004, 0), gripMat);
  grip.position.y = 0.0165;
  grip.receiveShadow = true;
  board.add(grip);

  // Two trucks, each with a baseplate, axle, hanger, two wheels and bearings
  for (const x of [-0.3, 0.3]) {
    const baseplate = part(new THREE.BoxGeometry(0.11, 0.012, 0.2), truckMat, x, -0.028, 0);
    board.add(baseplate);
    const hanger = part(new THREE.BoxGeometry(0.035, 0.03, 0.24), truckMat, x, -0.05, 0);
    board.add(hanger);
    const axle = part(new THREE.CylinderGeometry(0.007, 0.007, 0.26, 10), truckMat, x, -0.058, 0);
    axle.rotation.x = Math.PI / 2;
    board.add(axle);
    for (const z of [-0.105, 0.105]) {
      const wheel = part(new THREE.CylinderGeometry(0.05, 0.05, 0.034, 28), wheelMat, x, -0.085, z);
      wheel.rotation.x = Math.PI / 2;
      board.add(wheel);
      const bearing = part(new THREE.CylinderGeometry(0.013, 0.013, 0.036, 14), bearingMat, x, -0.085, z);
      bearing.rotation.x = Math.PI / 2;
      board.add(bearing);
    }
  }
  // Keep the feet on the board
  legL.pivot.position.y = 0.5;
  legR.pivot.position.y = 0.5;

  // Lift the whole runner so the wheels touch the ground (board is at -1.155 locally)
  runner.position.y = 1.275;

  // ---------- Animation ----------
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    const cyc = t * 7;                        // run speed

    // Bob the whole body
    body.position.y = 0;   // keep feet on the board; the leg swing gives the running motion
    body.rotation.z = Math.sin(cyc) * 0.02;

    // Legs and arms swing opposite each other
    const swing = Math.sin(cyc) * 0.7;
    legL.pivot.rotation.x = swing;
    legR.pivot.rotation.x = -swing;
    legL.knee.rotation.x = Math.max(0, -Math.sin(cyc + 0.6)) * 0.9;
    legR.knee.rotation.x = Math.max(0, Math.sin(cyc + 0.6)) * 0.9;
    armL.rotation.x = -swing * 0.8;
    armR.rotation.x = swing * 0.8;

    // Head and beanie gently follow the bob
    head.rotation.z = Math.sin(cyc * 0.5) * 0.03;

    // Board slight hover

    // Slow orbit camera (drag to rotate)
    camera.position.set(
      Math.sin(camYaw) * Math.cos(camPitch) * camDist,
      0.9 + Math.sin(camPitch) * camDist,
      Math.cos(camYaw) * Math.cos(camPitch) * camDist
    );
    camera.lookAt(0, 1.0, 0);

    renderer.render(scene, camera);
  }

  // ---------- Drag / zoom ----------
  let dragging = false, lastX = 0, lastY = 0;
  renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener('pointerup', () => { dragging = false; });
  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    camYaw   -= (e.clientX - lastX) * 0.01;
    camPitch = Math.max(-0.2, Math.min(0.8, camPitch + (e.clientY - lastY) * 0.01));
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('wheel', (e) => {
    camDist = Math.max(3, Math.min(12, camDist + e.deltaY * 0.005));
  }, { passive: true });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
})();
</script>
</body>
</html>
